name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - feat/frontend-v2

permissions:
  contents: read

jobs:
  python-smoke:
    name: Python smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install lightweight dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi
          python -m pip install numpy pillow opencv-python-headless pydantic requests tqdm

      - name: Compile tracked Python files
        run: python -m compileall -q $(git ls-files '*.py')

      - name: Import smoke
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          for module_path in ("hivision/error.py", "hivision/utils.py"):
              spec = importlib.util.spec_from_file_location(Path(module_path).stem, module_path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              print(f"import ok: {module_path}")
          PY

  web-smoke:
    name: Web smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect web package
        id: web
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.web.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.web.outputs.present == 'true'
        run: npm ci

      - name: Lint or type smoke
        if: steps.web.outputs.present == 'true'
        run: npm run lint --if-present
