name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - feat/frontend-v2

permissions:
  contents: read

jobs:
  python-smoke:
    name: Python smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install lightweight dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi
          python -m pip install numpy pillow opencv-python-headless pydantic requests tqdm

      - name: Compile tracked Python files
        run: python -m compileall -q $(git ls-files '*.py')

      - name: Import smoke
        run: |
          python - <<'PY'
          import importlib

          for module in ("hivision", "hivision.error", "hivision.utils"):
              importlib.import_module(module)
              print(f"import ok: {module}")
          PY

  web-smoke:
    name: Web smoke
    runs-on: ubuntu-latest
    if: ${{ hashFiles('web/package.json') != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint or type smoke
        run: npm run lint --if-present
