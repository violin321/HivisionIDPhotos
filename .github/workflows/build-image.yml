name: build image and push

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to Docker Hub'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - '*'

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests tqdm

      - name: Download models
        run: python scripts/download_model.py --models all

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image push mode
        id: image
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=${{ inputs.push_image || false }}" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${{ vars.IMAGE_NAME }}" ]; then
            echo "image_name=${{ vars.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_name=hivision-idphotos" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.image.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.image.outputs.push == 'true' }}
          tags: |
            ${{ steps.image.outputs.image_name }}:latest
            ${{ steps.image.outputs.image_name }}:${{ github.ref_name }}
